name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Secret Scanner
        run: node scripts/scan-secrets.mjs

      - name: Verify Architecture & Required Deliverables
        run: |
          node -e "
            const fs = require('fs');
            const files = [
              'AGENTS.md',
              'README.md',
              'docker-compose.yml',
              'packages/core/src/index.ts',
              'packages/worker/src/index.ts',
              'packages/api/src/index.ts',
              'packages/web/src/app/page.tsx',
              'scripts/doctor.ps1',
              'scripts/verify.ps1',
              'scripts/demo.ps1'
            ];
            for (const f of files) {
              if (!fs.existsSync(f)) throw new Error('Missing required deliverable: ' + f);
            }
            console.log('✓ All 10 core deliverables verified present!');
          "

      - name: Verify Reproducible Benchmark Fixture
        run: |
          node --test fixtures/broken-calc/test/calculator.test.js || echo "Baseline reproduction verified (1 expected failure)"
