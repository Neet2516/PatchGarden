services:
  # ────────────────────────────────────────────────────────────────────────────
  # PatchGarden Backend API Service
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: patchgarden-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w packages/core && npm run build -w packages/api
    startCommand: node packages/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: ./patchgarden.db
      - key: LOG_LEVEL
        value: info
      - key: FRONTEND_URL
        value: https://patchgarden-web.onrender.com

  # ────────────────────────────────────────────────────────────────────────────
  # PatchGarden Frontend Next.js Web App
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: patchgarden-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w packages/web
    startCommand: npm run start -w packages/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://patchgarden-api.onrender.com
