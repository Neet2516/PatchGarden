services:
  # ────────────────────────────────────────────────────────────────────────────
  # PatchGarden Backend API Service
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: patchgarden-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build -w packages/core && npm run build -w packages/api
    startCommand: node packages/api/dist/index.js
    healthCheckPath: /health
    disk:
      name: patchgarden-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/patchgarden.db
      - key: LOG_LEVEL
        value: info
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        value: default
      - key: FRONTEND_URL
        fromService:
          type: web
          name: patchgarden-web
          property: url

  # ────────────────────────────────────────────────────────────────────────────
  # PatchGarden Frontend Next.js Web App
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: patchgarden-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build -w packages/web
    startCommand: npm run start -w packages/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: patchgarden-api
          property: url
